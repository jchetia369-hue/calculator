<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphism Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator-container">

        <!-- Light / Dark Mode -->
        <div class="mode">
            <span id="modeText">LIGHT MODE</span>

            <label class="toggle">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Calculator -->
        <div class="calculator">

            <div class="display">
                <div id="history"></div>
                <div id="display">0</div>
            </div>

            <div class="buttons">

                <button class="function" data-action="clear">C</button>
                <button class="function" data-action="sign">+/-</button>
                <button class="function" data-action="percent">%</button>
                <button class="operator" data-action="/">÷</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button class="operator" data-action="*">×</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button class="operator" data-action="-">−</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="operator" data-action="+">+</button>

                <button class="zero" data-number="0">0</button>
                <button data-number=".">.</button>
                <button class="equal" data-action="=">=</button>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
